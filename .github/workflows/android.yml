name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build flex bison

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native libraries
        run: |
          chmod +x android/*.sh
          cmake --version
          ./android/build_native.sh arm64-v8a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/OpenMoHAA-android-${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-android-${{ github.run_number }}
          path: out/*.apk

      - name: Publish as release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            Автоматическая сборка из коммита ${{ github.sha }}.
            Скачайте файл .apk ниже и установите на телефон.
          files: out/*.apk
          prerelease: true
